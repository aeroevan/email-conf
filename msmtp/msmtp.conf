# msmtp configuration - sends via Gmail, authenticating with an
# OAuth2 (XOAUTH2) token fetched from the pizauth daemon.
#
# The pizauth account name in passwordeval must match the account block in
# pizauth/pizauth.conf.

defaults
host smtp.gmail.com
port 587
# Gmail only advertises AUTH after STARTTLS, and msmtp 1.8 leaves tls off by
# default -- without this, XOAUTH2 is never offered and the send fails.
tls on
from aeroevan@gmail.com
user aeroevan@gmail.com
auth xoauth2
passwordeval pizauth show aeroevan@gmail.com

# msmtp requires a named account -- "defaults" only supplies fallback values,
# so without this every send failed with "account default not found".  The
# settings above are inherited, so the block needs nothing but a name.
account gmail

account default : gmail
